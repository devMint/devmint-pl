name: 🚀 Deploy website to Cloudflare

on:
  workflow_call:
    inputs:
      package_name:
        type: string
        required: true
      environment:
        type: string
        default: 'Production'
    secrets:
      cloudflare_token:
        required: true
      cloudflare_account:
        required: true
      gh_token:
        required: true
    outputs:
      deployment-url:
        description: 'The URL of the deployed website'
        value: ${{ jobs.cloudflare.outputs.deployment-url }}
      command-output:
        description: 'The output of the command'
        value: ${{ jobs.cloudflare.outputs.command-output }}
      command-stderr:
        description: 'The stderr of the command'
        value: ${{ jobs.cloudflare.outputs.command-stderr }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloudflare:
    name: 'Deploy to Cloudflare'
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
      command-output: ${{ steps.deploy.outputs.command-output }}
      command-stderr: ${{ steps.deploy.outputs.command-stderr }}
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v5

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: ⎔ Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24.9.0'
          cache: 'pnpm'

      - name: 💾 Set up cache for Wireit
        uses: google/wireit@setup-github-actions-caching/v2

      - name: 💾 Restore cache
        uses: actions/cache/restore@v4
        with:
          path: 'packages/${{ inputs.package_name }}/.cache'
          key: 'cache-${{ inputs.package_name }}-${{ runner.os }}-${{ github.ref }}'
          restore-keys: |
            cache-${{ inputs.package_name }}-${{ runner.os }}-${{ github.ref }}
            cache-${{ inputs.package_name }}-${{ runner.os }}
            cache-${{ inputs.package_name }}-

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 📦 Build
        run: pnpm --filter=${{ inputs.package_name}} build

      - name: 🚀 Create GitHub Deployment
        uses: chrnorm/deployment-action@v2
        id: github_deployment
        with:
          token: ${{ secrets.gh_token }}
          environment: ${{ inputs.environment }}

      - name: 🚀 Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.cloudflare_token }}
          accountId: ${{ secrets.cloudflare_account }}
          gitHubToken: ${{ secrets.gh_token }}
          workingDirectory: 'packages/${{ inputs.package_name }}'
          command: 'versions upload'
          packageManager: pnpm

      - name: 🔍 Preview URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: echo ${{ env.DEPLOYMENT_URL }}

      - name: Update deployment status (success)
        if: success()
        uses: chrnorm/deployment-status@v2
        with:
          token: '${{ github.token }}'
          environment-url: ${{ steps.deploy.outputs.deployment-url }}
          deployment-id: ${{ steps.github_deployment.outputs.deployment_id }}
          state: 'success'

      - name: Update deployment status (failure)
        if: failure()
        uses: chrnorm/deployment-status@v2
        with:
          token: '${{ github.token }}'
          environment-url: ${{ steps.deploy.outputs.deployment-url }}
          deployment-id: ${{ steps.github_deployment.outputs.deployment_id }}
          state: 'failure'

      - name: 💾 Save cache for Astro
        if: success()
        uses: actions/cache/save@v4
        with:
          path: 'packages/${{ inputs.package_name }}/.cache'
          key: 'cache-${{ inputs.package_name }}-${{ runner.os }}-${{ github.ref }}'
