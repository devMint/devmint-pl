name: 🔥 Keep cache hot

on:
  workflow_call:
    inputs:
      package_name:
        type: string
        required: true

jobs:
  hot-cache:
    name: 'Test'
    runs-on: ubuntu-latest
    steps:
      - name: 💾 Restore cached images
        id: cache-images-restore
        uses: actions/cache/restore@v4
        with:
          path: 'packages/${{ inputs.package_name }}/.cache'
          key: 'cache-${{ inputs.package_name }}-${{ runner.os }}-${{ github.ref }}'
          restore-keys: |
            cache-${{ inputs.package_name }}-${{ runner.os }}-${{ github.ref }}
            cache-${{ inputs.package_name }}-${{ runner.os }}
            cache-${{ inputs.package_name }}-