name: 🔥 Keep images cache hot

on:
  schedule:
    - cron: 0 6 * * 6 # Every Saturday at 6:00 AM

jobs:
  hot-cache:
    name: 🔥 Hot cache for ${{ matrix.package_name }}
    uses: ./.github/workflows/workflow-restore-cache.yaml
    strategy:
      matrix:
        package_name: ['devmint-pl']
    with:
      package_name: ${{ matrix.package_name }}
